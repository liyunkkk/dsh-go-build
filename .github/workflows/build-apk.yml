name: build-apk

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main, 'merge-upstream-*']

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator 2>/dev/null || true
          sudo apt-get clean
          echo "--- 释放后 ---"
          df -h /

      - name: Apply shell tool patch (optional)
        run: |
          if [ -f 0001-add-shell-tool.patch ] && git apply --check 0001-add-shell-tool.patch 2>/dev/null; then
            git apply --verbose 0001-add-shell-tool.patch
          else
            echo "no patch to apply (change is already in the tree)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK for tawcroot (pinned 28.2.13676358)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "ndk;28.2.13676358"
          fi
          grep '^Pkg.Revision' "$NDK_DIR/source.properties"
          # runner 预装的 NDK 会让 ANDROID_NDK_HOME 指向别的版本，
          # tawcroot/build.py 优先读它，版本不符就报 "needs NDK"。
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Install toolchain deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd file gpgv

      - name: Build runtime (arm64-v8a)
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64

      - name: Show artifacts
        run: find app/build/app/outputs -name '*.apk' -exec ls -lh {} \;

      # artifact 配额按账号算（500MB），满了就传不上去；Release 资产不占这个配额，
      # 所以先发 Release，artifact 只当顺手备份，失败不阻塞。
      - name: Publish APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.1.0-shell-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "DSH Go 1.1.0 + shell root（run ${{ github.run_number }}）" \
            --notes "上游 ccch1mneyyy/dsh-go v1.1.0 + ghjicb 的 shell root 三档终端权限。arm64 / debug 签名。" \
            || true
          gh release upload "$TAG" app/build/app/outputs/flutter-apk/*.apk --clobber
          echo "release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 1
